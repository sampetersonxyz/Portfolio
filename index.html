<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temporary Portfolio</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 2rem;
      background: #f4f6fb;
      color: #1a1a1a;
    }
    header {
      max-width: 700px;
      margin: 0 auto;
      text-align: center;
    }
    h1 {
      margin-bottom: 0.25rem;
    }
    p {
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    button {
      margin-top: 1rem;
      padding: 0.75rem 1.25rem;
      border: none;
      border-radius: 6px;
      background: #3b82f6;
      color: #fff;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover {
      background: #2563eb;
    }
    #message {
      margin-top: 1.25rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to My Temporary Website</h1>
    <p>This is a placeholder page generated with an embedded script. Click the button below to update the message.</p>
    <button id="actionButton">Show the current time</button>
    <div id="message"></div>
  </header>
  <script>
    const button = document.getElementById('actionButton');
    const message = document.getElementById('message');

    button.addEventListener('click', () => {
      const now = new Date();
      message.textContent = `Current local time is ${now.toLocaleTimeString()}.`;
    });
  </script>
</body>
</html>
