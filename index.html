<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temporary Portfolio</title>
  <style>
    body {
      margin: 0;
      padding: 6rem;
      background: #000000;
      font-family: 'JetBrains Mono', monospace;
      color: #ffffff;
    }
    header {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: #ffffff;
    }
    h1 {
      margin-bottom: 0.25rem;
      font-size: clamp(1.5rem, 4vw, 4rem)
    }
    p {
      line-height: 1.6;
      background:  #444444;
      margin-bottom: 1.5rem;
    }
    button {
      margin-top: 1rem;
      padding: 0.75rem 1.25rem;
      border: none;
      border-radius: 6px;
      background: #3b82f6;
      color: #fff;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover {
      background: #2563eb;
    }
    #message {
      margin-top: 1.25rem;
      font-weight: 600;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <h1>SamPeterson.xyz</h1>
    <h1>Portfolio</h1>
  </header>
  <p>This is a placeholder page generated with an embedded script. Click the button below to update the message.</p>
  <button id="actionButton">Show the current time</button>
  <div id="message"></div>
  <br/>
  <script>
    const button = document.getElementById('actionButton');
    const message = document.getElementById('message');

    button.addEventListener('click', () => {
      const now = new Date();
      message.textContent = `Current local time is ${now.toLocaleTimeString()}.`;
    });
  </script>
</body>
</html>
